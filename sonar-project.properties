# SonarCloud configuration
# This file is used by the SonarCloud scanner to analyze code quality

# Project identification (these will be overridden by command line args in CI)
sonar.projectKey=YOUR_PROJECT_KEY
sonar.organization=YOUR_ORGANIZATION

# Project metadata
sonar.projectName=SAE5.01 - Emotion Detection System
sonar.projectVersion=1.0.0

# Source code paths (Android app only)
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java,app/src/androidTest/java

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=kotlin,java

# Android specific
sonar.java.binaries=app/build/intermediates/javac/debug/classes
sonar.android.lint.report=app/build/reports/lint-results-debug.xml

# Kotlin specific
sonar.kotlin.source.version=1.9

# Exclusions (files to ignore)
sonar.exclusions=**/build/**,\
                 **/*.gradle.kts,\
                 **/R.java,\
                 **/BuildConfig.java,\
                 **/generated/**,\
                 **/*Test.kt,\
                 **/*Test.java

# Test coverage exclusions
sonar.coverage.exclusions=**/test/**,\
                          **/androidTest/**,\
                          **/*Test.kt,\
                          **/*Test.java

# Code coverage (optional - requires JaCoCo)
# sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml,backend/build/reports/jacoco/test/jacocoTestReport.xml
