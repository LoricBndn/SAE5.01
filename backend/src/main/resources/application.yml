spring:
  application:
    name: sae501-backend

  datasource:
    url: jdbc:mysql://localhost:3306/sae501_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

file:
  upload-dir: ./uploads

jwt:
  secret: SAE501SecretKeyForJWTTokenGenerationAndValidation2025
  expiration: 86400000 # 24 hours in milliseconds
